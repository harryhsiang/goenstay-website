<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>付款結果 | 有緣居共享空間</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --oak: #8a5c2e; --oak-deep:#6a3e18; --oak-light:#c8a060;
  --oak-bg:#f5f0e8; --cream:#faf7f2; --border:#ddd0b8; --border-light:#ece2cf;
  --text:#3a3228; --text-soft:#5a5040; --muted:#8a7e6e;
  --green:#5a7a50; --shadow:0 4px 24px rgba(90,60,20,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--oak-bg); font-family:'Noto Sans TC',sans-serif;
  color:var(--text); min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:24px;
}
.card {
  background:var(--cream); border:1px solid var(--border);
  border-radius:20px; padding:clamp(28px,5vw,48px);
  max-width:480px; width:100%; text-align:center;
  box-shadow:var(--shadow);
}
.icon-circle {
  width:72px; height:72px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:32px; margin:0 auto 20px;
}
.icon-circle.success { background:#e8f5e9; }
.icon-circle.fail    { background:#fef2f2; }
.card-title {
  font-family:'Noto Serif TC',serif;
  font-size:clamp(20px,4vw,26px); font-weight:400;
  letter-spacing:0.06em; margin-bottom:8px;
}
.card-title.success { color:var(--green); }
.card-title.fail    { color:#c0392b; }
.card-sub {
  font-size:14px; color:var(--muted); line-height:1.9;
  margin-bottom:28px;
}
.info-box {
  background:var(--oak-bg); border:1px solid var(--border);
  border-radius:12px; padding:18px 20px;
  text-align:left; margin-bottom:24px;
}
.info-row {
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:6px 0; font-size:13px;
  border-bottom:1px solid var(--border-light);
}
.info-row:last-child { border-bottom:none; }
.info-row .k { color:var(--muted); flex-shrink:0; margin-right:12px; }
.info-row .v { color:var(--text); font-weight:500; text-align:right; }
.btn {
  display:inline-flex; align-items:center; gap:8px;
  padding:13px 28px; border-radius:30px; border:none;
  font-family:'Noto Sans TC',sans-serif; font-size:13px;
  font-weight:500; letter-spacing:0.1em; cursor:pointer;
  text-decoration:none; transition:all 0.2s;
}
.btn-primary { background:var(--oak); color:white; }
.btn-primary:hover { background:var(--oak-deep); transform:translateY(-1px); }
.btn-ghost {
  background:none; border:1.5px solid var(--border);
  color:var(--text-soft); margin-left:10px;
}
.btn-ghost:hover { border-color:var(--oak); color:var(--oak); }
.notice {
  font-size:11px; color:var(--muted); margin-top:16px; line-height:1.8;
}
</style>
</head>
<body>
<div class="card" id="result-card">
  <!-- 內容由 JS 填入 -->
  <div class="icon-circle" id="icon-circle">⏳</div>
  <h1 class="card-title" id="card-title">讀取付款結果中...</h1>
  <p class="card-sub" id="card-sub"></p>
  <div class="info-box" id="info-box" style="display:none"></div>
  <div id="actions"></div>
</div>

<script>
// 綠界付款結果會把參數附在 URL query string 或由 form POST
// OrderResultURL 是瀏覽器跳轉，帶 GET 參數
(function() {
  const p = new URLSearchParams(window.location.search);
  const rtnCode = p.get('RtnCode');
  const tradeNo = p.get('MerchantTradeNo') || p.get('TradeNo');
  const tradeAmt = p.get('TradeAmt');
  const paidAt  = p.get('PaymentDate');

  const icon  = document.getElementById('icon-circle');
  const title = document.getElementById('card-title');
  const sub   = document.getElementById('card-sub');
  const box   = document.getElementById('info-box');
  const acts  = document.getElementById('actions');

  if (rtnCode === '1') {
    // ── 付款成功 ──────────────────────────────
    icon.innerHTML = '✅';
    icon.className = 'icon-circle success';
    title.textContent = '預約成功！';
    title.className   = 'card-title success';
    sub.textContent   = '感謝你的預約，系統已收到付款。確認通知即將透過 LINE 發送，使用前 1 小時會再傳送門鎖密碼。';

    let rows = '';
    if (tradeNo)  rows += row('訂單編號', tradeNo);
    if (tradeAmt) rows += row('付款金額', `NT$ ${Number(tradeAmt).toLocaleString()}`);
    if (paidAt)   rows += row('付款時間', paidAt);

    if (rows) {
      box.innerHTML = rows;
      box.style.display = '';
    }

    acts.innerHTML = `
      <a href="index.html" class="btn btn-primary">回到首頁</a>
      <a href="booking.html" class="btn btn-ghost">再次預約</a>
    `;
    document.title = '預約成功 | 有緣居共享空間';

  } else if (rtnCode) {
    // ── 付款失敗／取消 ────────────────────────
    icon.innerHTML = '❌';
    icon.className = 'icon-circle fail';
    title.textContent = '付款未完成';
    title.className   = 'card-title fail';
    sub.textContent   = '付款流程未完成或已取消，預約尚未成立。如有疑問請 LINE 私訊 @goenstay。';

    if (tradeNo) {
      box.innerHTML = row('訂單編號', tradeNo) + row('狀態說明', p.get('RtnMsg') || '付款取消');
      box.style.display = '';
    }

    acts.innerHTML = `
      <a href="booking.html" class="btn btn-primary">重新預約</a>
      <a href="index.html" class="btn btn-ghost">回首頁</a>
    `;
    document.title = '付款未完成 | 有緣居共享空間';

  } else {
    // ── 直接進入此頁（無參數） ─────────────────
    icon.innerHTML = '📋';
    title.textContent = '付款結果頁';
    sub.textContent   = '此頁面為付款完成後的跳轉目標，請透過預約流程前往付款。';
    acts.innerHTML = `<a href="booking.html" class="btn btn-primary">立即預約 →</a>`;
  }

  function row(k, v) {
    return `<div class="info-row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  }
})();
</script>
</body>
</html>
